[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewpulse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "pyarrow==17.0.0",
    "scikit-learn==1.5.2",
    "mlflow==2.17.2",
    "fastapi==0.115.5",
    "uvicorn==0.32.1",
    "pydantic==2.9.2",
    "streamlit==1.40.2",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.27.2",
    "ruff==0.8.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
