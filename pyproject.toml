[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewpulse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "pyarrow==24.0.0",
    "scikit-learn==1.5.2",
    "mlflow==3.16.0",
    "fastapi==0.141.1",
    "uvicorn==0.32.1",
    "pydantic==2.9.2",
    "streamlit==1.60.0",
    "requests==2.32.3",
    "great_expectations==1.23.0",
    "pyspark==4.2.0",
    "pyiceberg[sql-sqlite,pyarrow]==0.12.0",
    "duckdb==1.5.5",
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    # confluent-kafka retire le 19/09/2026, en meme temps que dans requirements.txt :
    # declare, jamais importe sur tout le depot. Laisse ici, il faisait echouer le
    # « pip check » de l'image Airflow, qui exigeait une dependance que rien n'installe.
    # A remettre le jour ou la brique Kafka sera construite (registre R17) ; la ligne
    # exacte etait : "confluent-kafka[avro,schemaregistry]==2.15.1"
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.27.2",
    "ruff==0.8.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "spark: tests qui démarrent une session PySpark (Java requis)",
    "dbt: tests qui construisent la gold avec dbt et DuckDB (extension iceberg requise)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
