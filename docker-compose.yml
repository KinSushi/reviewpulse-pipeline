# docker-compose.yml – configuration des services ReviewPulse
# Décisions appliquées ici : ADR 0012 (déploiement par Docker Compose),
# ADR 0017 (base PostgreSQL pour Airflow), ADR 0018 (images épinglées par empreinte).
# Le sel de pseudonymisation vient du fichier .env (facultatif) OU de l'environnement du shell.
# Pourquoi pas de contrôle ici : un contrôle Compose bloquerait aussi `docker compose ps` et `down`.
# Le contrôle est fait par l'application : reviewpulse.config.salt() refuse un sel absent ou vide,
# et la transformation s'arrête avant d'écrire la moindre donnée (vérifié le 16/09/2026).
x-secrets: &secrets
  REVIEWPULSE_SALT: ${REVIEWPULSE_SALT:-}
  # Cette variable rend les rapports traçables jusqu'au commit.
  REVIEWPULSE_COMMIT: ${REVIEWPULSE_COMMIT:-inconnu}

# Convention : le lac de données est monté sous /data dans TOUS les conteneurs.
# Pourquoi : le catalogue Iceberg enregistre des chemins absolus ; une table créée sous /data
# était introuvable pour un conteneur qui voyait le lac sous /app/data (constaté le 16/09/2026).
# En production, le même principe vaut pour un bucket S3 unique.

x-envfile: &envfile
  - path: .env
    required: false

services:
  mlflow:
    # Empreinte relevee le 19/09/2026 : l'etiquette seule ne garantit pas le meme contenu.
    image: ghcr.io/mlflow/mlflow:v3.16.0@sha256:470607da2a70fa38724d3d7db0a54a78b50fac708f7291bfebe1935fa95259ae
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,host.docker.internal,host.docker.internal:5000
    # --allowed-hosts : MLflow 3 rejette tout en-tête Host non listé (protection contre le DNS rebinding).
    # Sans le nom de service « mlflow », les autres conteneurs recevaient une erreur 403 (constaté le 16/09/2026).
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      # MLflow applique ses migrations au demarrage, sur une base SQLite portee par un
      # volume Docker : mesure du 19/09/2026, 170 s avant de repondre. Sans start_period,
      # le service est declare malade avant d'avoir pu demarrer et `compose up` abandonne.
      start_period: 180s

  pipeline:
    image: reviewpulse-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles:
      - jobs
    # Même enchaînement que le DAG quotidien, plus l'entraînement :
    # bronze → silver (Spark, Iceberg) → qualité → modèle → score → gold (dbt, DuckDB).
    command: sh -c 'python -m reviewpulse.ingest && python -m reviewpulse.spark_silver && python -m reviewpulse.expectations && python -m reviewpulse.train && python -m reviewpulse.score && python -m reviewpulse.gold'
    env_file: *envfile
    environment:
      <<: *secrets
    volumes:
      - ./data:/data
    depends_on:
      mlflow:
        condition: service_healthy

  api:
    image: reviewpulse-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file: *envfile
    volumes:
      - ./data:/data
    # Ce controle remplace celui de l'image, dont le timeout de 5 s est trop court ici.
    # Defaut mesure le 20/09/2026 : /health depend de get_model, donc il CHARGE le champion
    # depuis MLflow. Sur le disque externe, ce chargement depasse 5 s ; chaque controle
    # abandonnait en laissant sa requete en vol, et le suivant arrivait 30 s plus tard.
    # Empilees sur un unique processus uvicorn, elles empechaient l'API de devenir saine --
    # elle se noyait elle-meme. Le remede est le meme que pour MLflow et PostgreSQL :
    # laisser le temps du demarrage a froid, et espacer les controles.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=110).status == 200 else 1)"]
      interval: 60s
      timeout: 120s
      retries: 3
      start_period: 420s
    depends_on:
      mlflow:
        condition: service_healthy

  dashboard:
    image: reviewpulse-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      REVIEWPULSE_API_URL: http://api:8000
    volumes:
      - ./data:/data
    # L'image partagée vérifie l'API sur :8000 ; ce conteneur fait tourner Streamlit sur :8501.
    # Sans cette surcharge, le tableau de bord serait déclaré « unhealthy » à tort (constaté le 16/09/2026).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # SQLite ne supporte pas les accès concurrents ; le scheduler mourait lorsqu'il y avait plusieurs accès.
  airflow-db:
    image: postgres:16
    profiles:
      - airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    # La première initialisation de la base dépasse le délai par défaut
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      # Mesure du 19/09/2026 : apres un arret brutal de Docker, PostgreSQL a passe
      # 580 s en « syncing data directory (fsync) » avant d'accepter des connexions.
      # Un start_period de 60 s declarait le service malade bien avant qu'il ne puisse
      # repondre, et `compose up` abandonnait sur « dependency failed to start ».
      start_period: 600s
      retries: 10

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    profiles:
      - airflow
    # Même uid que l'utilisateur « app » (1000) des autres conteneurs, groupe 0 comme l'exige l'image Airflow.
    # Sans cela, Airflow (uid 50000) ne peut pas réécrire ./data créé par le pipeline :
    # PermissionError constatée le 16/09/2026 sur state/ et clean/.
    user: "${REVIEWPULSE_UID:-1000}:0"
    command: standalone
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/data
      # Le code du paquet est monte par-dessus celui que l'image a installe, pour que le
      # conteneur execute toujours la version versionnee du depot. Raison mesuree le
      # 19/09/2026 : l'ecriture de l'image (« exporting layers », 4,18 Go) se bloque sur le
      # disque externe, deux constructions de suite, sans jamais rendre la main ni d'erreur.
      # Changer une ligne de code ne doit pas dependre de la reecriture de quatre gigaoctets.
      # Le montage est declare ici, donc versionne : il ne remplace pas l'installation du
      # paquet, qui reste faite par le Dockerfile et verifiee par « pip check ».
      - ./src/reviewpulse:/opt/rp-venv/lib/python3.11/site-packages/reviewpulse:ro
    env_file: *envfile
    environment:
      <<: *secrets
      REVIEWPULSE_DATA_DIR: /data
      REVIEWPULSE_COMMIT: ${REVIEWPULSE_COMMIT:-inconnu}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    depends_on:
      mlflow:
        condition: service_healthy
      airflow-db:
        condition: service_healthy

volumes:
  mlflow_data:   # stockage persistant des artefacts et de la base SQLite de MLflow
  airflow_db:    # volume persistant pour la base PostgreSQL d'Airflow
