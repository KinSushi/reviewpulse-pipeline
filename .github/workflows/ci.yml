name: ci
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  # Job principal qui exécute les vérifications de code et les tests unitaires
  tests:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Xss4m
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint with Ruff
        # Ajout du répertoire tools aux vérifications
        run: ruff check src tests dags dashboard tools
      # Les portes qui decident de ce qui entre dans le depot sont elles-memes eprouvees :
      # seize temoins, chaque tolerance avec le refus voisin. Une porte qui n'a jamais refuse
      # ne prouve rien.
      - name: Portes — non-régression (équivalence, citations, journaux)
        run: sh tools/tester_portes.sh
      # Un journal est une sortie : aucun texte d'avis, identifiant, sel ni DataFrame entier
      # ne doit y passer, et aucune chaine n'est formatee avant l'appel.
      - name: Journaux — aucune donnée, aucune f-string
        run: sh tools/verifier_journaux.sh
      - name: Documentation — documents cités, liens vivants, aucune signature d'outil
        run: sh tools/verifier_documentation.sh
      # Un document perime fait paraitre inacheve un projet qui ne l'est pas : les totaux ecrits dans
      # les documents tournes vers le jury doivent etre ceux du depot, et aucune case n'y reste ouverte.
      - name: Chiffres — les documents ne contredisent pas le dépôt
        run: sh tools/verifier_chiffres.sh
      - name: Run tests
        env:
          REVIEWPULSE_SALT: ci-salt
        run: pytest -q

  # Job secondaire qui vérifie que la batterie détecte les défauts connus
  reverse-tests:
    needs: tests
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Xss4m
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Exécuter les tests inversés
        env:
          REVIEWPULSE_COMMIT: ${{ github.sha }}
        run: python tools/reverse_tests.py
      # Le televersement ne doit pas rougir une campagne verte. Mesure du 20/09/2026,
      # premiere execution de cette CI : les 26 mutations ont ete tuees, zero survivante,
      # et le job a quand meme echoue sur « Artifact storage quota has been hit » -- un
      # quota de compte, sans rapport avec le code. Un rapport qu'on n'archive pas est une
      # gene ; une campagne verte rapportee rouge est un mensonge. La retention est bornee
      # pour cesser d'alimenter ce quota.
      - name: Téléverser le rapport des tests inversés
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reverse-tests-report
          path: docs/evidence/reverse_tests.md
          retention-days: 7
